[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmval"
version = "1.0.2"
description = "Live OpenRouter LLM prices + Artificial Analysis intelligence & coding benchmarks dashboard"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Hariharen", email = "contact@hariharen.site" }
]
keywords = ["llm", "openrouter", "artificial-analysis", "benchmarks", "coding", "pricing", "dashboard"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://hariharen.site"
"Creator Website" = "https://hariharen.site"

[project.scripts]
llmval = "llmval.app:main"

[tool.setuptools]
packages = ["llmval"]

[tool.setuptools.package-data]
llmval = ["web/*", "web/**/*", "data/*", "data/**/*"]
